<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12244a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MCK မြန်မာစာ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>MCK မြန်မာစာ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;700&family=Noto+Serif+Myanmar:wght@500;700&display=swap">
<style>
/* Layout: navy masthead like the other MCK exam apps, then grade > lesson > chapter, with three big type tabs. */
:root{
  --paper:#f2f4f8; --card:#ffffff; --ink:#14213a; --muted:#59667f; --line:#d3d9e4;
  --navy:#12244a; --navy-2:#1d3a72; --on-navy:#ffffff;
  --accent:#1d4fb8; --accent-soft:#dfe8fa; --on-accent:#ffffff; --gold:#e9b949;--gold-soft:#fff4d6;
  --ok:#1b7a45; --ok-soft:#d8f0e1; --bad:#b3372b; --bad-soft:#f8dedb;
  --font-body:'Noto Sans Myanmar','Padauk','Myanmar Text',sans-serif;
  --font-display:'Noto Serif Myanmar','Noto Sans Myanmar','Padauk',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1526; --card:#152038; --ink:#e7ecf7; --muted:#95a3c0; --line:#28365a;
    --navy:#0a1226; --navy-2:#17305f; --on-navy:#ffffff;
    --accent:#7ba6ff; --accent-soft:#1c2d55; --on-accent:#0d1526; --gold:#d9ad45; --gold-soft:#3a3118;
    --ok:#62d391; --ok-soft:#153a29; --bad:#ff8c7d; --bad-soft:#40201d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1526; --card:#152038; --ink:#e7ecf7; --muted:#95a3c0; --line:#28365a;
  --navy:#0a1226; --navy-2:#17305f; --on-navy:#ffffff;
  --accent:#7ba6ff; --accent-soft:#1c2d55; --on-accent:#0d1526; --gold:#d9ad45; --gold-soft:#3a3118;
  --ok:#62d391; --ok-soft:#153a29; --bad:#ff8c7d; --bad-soft:#40201d; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.9}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.gut{padding-inline:16px}
.wrap{max-width:780px;margin-inline:auto}

.mast{background:var(--navy);color:var(--on-navy);background-image:repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.045) 22px 44px)}
.mast .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;color:var(--on-navy);text-decoration:none}
.brand b{font-family:var(--font-display);font-size:1.3rem}
.brand small{opacity:.75;font-size:.78rem}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:.85rem;opacity:.95}
.crumbs a{color:var(--on-navy);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}
.crumbs span{opacity:.8}

h1,h2,h3{font-family:var(--font-display);line-height:1.55;text-wrap:balance;margin:0}
h1{font-size:1.8rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
.lead{color:var(--muted);margin:4px 0 0}
.hero{padding-block:24px 6px}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--gold) 62%,var(--gold) 92%,transparent 92%)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;margin-block:18px}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .glyph{position:absolute;right:12px;top:6px;font-family:var(--font-display);font-size:3.4rem;font-weight:700;line-height:2;color:var(--accent-soft);pointer-events:none;user-select:none}
.card h3,.card p,.card .meta{position:relative}
.card p{margin:0;color:var(--muted);font-size:.9rem}
.card .meta{margin-top:auto;padding-top:6px;font-size:.82rem;font-weight:500;color:var(--accent)}
.card.soon{border-style:dashed;background:transparent;color:var(--muted)}
.card.soon .meta{color:var(--muted)}

.chs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-block:16px 0}
.ch{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;min-height:64px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);line-height:1.6}
.ch b{font-family:var(--font-display);font-size:1rem}
.ch small{color:var(--muted);font-size:.74rem;line-height:1.5}
.ch[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ch[aria-current="true"] small{color:var(--on-accent);opacity:.9}
@media (max-width:520px){.chs{grid-template-columns:1fr}.ch{flex-direction:row;align-items:center;gap:10px}}

.sets{margin-top:14px}
.settab{min-height:52px;font-size:1.05rem}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;margin-top:10px;border-bottom:1.5px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scrollnav{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;gap:10px}
.scrollnav button{width:48px;height:48px;border-radius:50%;border:2px solid var(--accent);background:var(--paper);color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center;padding:0;cursor:pointer}
.scrollnav button:active{background:var(--accent);color:var(--on-accent)}
.scrollnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.plabel{display:inline-block;margin:0 0 4px;padding:0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.74rem;font-weight:700;line-height:1.7}
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1.5px solid var(--line)}
.pbar .jump{margin-top:0}
.pnote{margin:4px 0 0;color:var(--muted);font-size:.85rem}
.pinfo{margin:10px 0 0;padding-left:1.2rem;line-height:1.9}
.durs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ptimer{font-family:var(--font-display);font-weight:700;font-size:1.6rem;color:var(--accent)}
.ptimer.low{color:var(--bad)}
.presult{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--ok-soft);color:var(--ok);display:grid;gap:4px}
.presult b{font-size:1.2rem}
.pmeta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}
.pmeta .code{font-weight:700;color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;font-size:.8rem;margin-left:auto}
.who[hidden]{display:none}
.who b{font-weight:700}
.who button{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.7);background:transparent;color:var(--on-navy);font:inherit;font-size:.8rem}
.lg{max-width:420px;margin:24px auto 0;display:grid;gap:12px}
.lg label{font-weight:700;display:grid;gap:6px}
.lg input{min-height:52px;padding:6px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem}
.lg .err{color:var(--bad);font-weight:700;min-height:1.6em}
.tabs.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.tabs.sets{grid-template-columns:repeat(2,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;padding:4px 6px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;line-height:1.5;text-align:center}
.tab small{font-weight:400;font-size:.74rem;color:var(--muted)}
.tab[aria-selected="true"]{background:linear-gradient(180deg,var(--navy-2),var(--navy));border-color:var(--navy);color:var(--on-navy)}
.tab[aria-selected="true"] small{color:var(--on-navy);opacity:.85}
.tab:active{transform:scale(.98)}

.secbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-block:16px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:2px 16px;border:1.5px solid var(--accent);border-radius:10px;background:transparent;color:var(--accent);font-weight:500}
.btn.solid{background:linear-gradient(180deg,var(--accent),var(--navy-2));border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.solid{color:var(--on-accent)}

.jump{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.jump button{flex:none;min-height:40px;padding:4px 14px;border-radius:999px;border:1.5px solid var(--accent);background:var(--paper);color:var(--accent);font:inherit;font-size:.88rem;font-weight:600;white-space:nowrap}
.jump button small{font-weight:500;color:var(--muted);margin-left:6px}
.jump button:active,.jump button.on{background:var(--accent);color:var(--on-accent)}
.jump button.on small,.jump button:active small{color:inherit}
.group.flash>h3{animation:fl 1.4s ease}
@keyframes fl{0%,60%{background:var(--gold-soft)}100%{background:transparent}}
.group{margin-block:22px 0}
.group>h3{padding-bottom:4px;border-bottom:2px solid var(--accent);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.group>h3 span{font-family:var(--font-body);font-size:.78rem;font-weight:500;color:var(--muted)}
ol.qs{list-style:none;margin:0;padding:0}
.q{display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:0 4px;padding-block:14px;border-bottom:1px dashed var(--line)}
.q .no{font-family:var(--font-display);font-weight:700;color:var(--accent)}
.qt{margin:0}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;max-width:360px}
.opt{min-height:48px;padding:2px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-weight:500}
.opt:hover{border-color:var(--accent)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.q.revealed .opt[data-c="1"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.q.revealed .opt.picked:not([data-c="1"]){border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.blank{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:0;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0;min-width:9em;width:min(14em,100%);padding:2px 8px;margin-inline:4px;text-align:center}
.blank.ok{border-bottom-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.blank.bad{border-bottom-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ch3{display:flex;gap:12px;align-items:baseline;text-align:left;min-height:48px;padding:6px 14px;width:100%}
.ch3 i{font-style:normal;font-weight:700;color:var(--accent);flex:none}
.ch3 span{min-width:0;overflow-wrap:anywhere}
.q.revealed .ch3[data-c="1"] i{color:var(--ok)}
.gap{letter-spacing:1px;color:var(--muted)}
.rv{margin-top:6px;min-height:40px;padding:0 4px;border:0;background:none;color:var(--accent);font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.kw mark{background:linear-gradient(transparent 8%,var(--gold) 8%);color:inherit;border-radius:4px;padding:0 6px}
.q.hot .no{color:var(--ink)}
.kw{margin:0;font-family:var(--font-display);font-weight:700;font-size:1.25rem;line-height:1.7}
.ans{margin-top:2px;padding:4px 12px;border-radius:8px;background:var(--ok-soft);color:var(--ok);font-size:.95rem}
.ans[hidden]{display:none}
.ans small{display:block;color:var(--muted);font-size:.8rem;line-height:1.6}

.src{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px;border-radius:999px;background:var(--gold-soft);border:1px solid var(--gold);color:var(--ink);font-size:.78rem;line-height:1.5}
.chip b{display:inline-grid;place-items:center;min-width:1.9em;padding:0 6px;border-radius:999px;background:var(--gold);color:#1a1a1a;font-weight:700}
.chip.f{background:var(--accent-soft);border-color:var(--accent)}
.chip.f b{background:var(--accent);color:#fff}
.empty{margin-block:22px;padding:26px 18px;border:2px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:1.05rem}
.note{margin-block:16px 0;padding:8px 14px;border-radius:8px;background:var(--accent-soft);font-size:.9rem}
.foot{margin-block:40px 32px;padding-top:14px;border-top:2px solid var(--line);color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="mast gut"><div class="wrap">
  <a class="brand" href="#" data-nav=""><b>မြန်မာစာ</b><small>MCK Education Center</small></a>
  <nav class="crumbs" id="crumbs" aria-label="လမ်းကြောင်း"></nav>
  <div class="who" id="who" hidden></div>
</div></header>
<div class="gut"><div class="wrap">
  <main id="app"></main>
  <div class="foot">MCK Education Center · ဒွါဒသမတန်း မြန်မာစာ မေးခွန်းလွှာများနှင့် အဖြေများ</div>
</div></div>

<script>
/* ===== ဒေတာ ===== */
// [စာအုပ်ထဲက မေးခွန်းနံပါတ်, မေးခွန်း, အဖြေ T=မှန် F=မှား, မှတ်ချက် (ရှိလျှင်)]
const TF = [
[1,'အမျိုးသားများ၏ နိမ့်မြင့်သံသည် အမျိုးသမီးများ၊ ကလေးများထက် ယေဘုယျအားဖြင့် ပိုမိုမြင့်မားပြီး ပိုမို၍ လေးနက်သည်။','F'],
[2,'အသံကြိုးများကို တင်းလိုက်ခြင်းအားဖြင့် နိမ့်မြင့်သံကို အမြင့်သို့ရောက်အောင် မြှင့်တင်ပေးနိုင်သည်။','T'],
[2,'အသံကြိုးများကို တင်းလိုက်ခြင်းအားဖြင့် နိမ့်မြင့်သံကို မြှင့်တင်ပေးနိုင်သည်။','T'],
[3,'ဘာသာစကားတိုင်းတွင် အသံအနိမ့်အမြင့်သည် အတိမ်းအစောင်းမခံနိုင်သော သဘောတရားတစ်ရပ် ဖြစ်ပါသည်။','T'],
[4,'အသံအနိမ့်အမြင့်လွဲမှားမှုသည် ပြောသူရော နာသူတွင်ပါ ရှုပ်ထွေးမှုများ ညီတူမျှတူ ဖြစ်ပေါ်စေသည်။','T'],
[4,'အသံအနိမ့်အမြင့်လွဲမှားမှုသည် ပြောသူရော နာသူတွင်ပါ ရှုပ်ထွေးမှုများ ဖြစ်ပေါ်စေသည်။','T'],
[5,'အသံအနိမ့်အမြင့်နှင့် ဝါကျနိမ့်မြင့်သံများ တိမ်းစောင်းလွဲချော်သော်လည်း သတ်မှတ်အနက်အဓိပ္ပာယ်ကို ရနိုင်ပါသည်။','F'],
[6,'အသံအနိမ့်အမြင့် မမှန်ရုံဖြင့် ပြောသူရော နာသူပါ ရှုပ်ထွေးမှု ညီတူညီမျှ မဖြစ်ပေါ်စေနိုင်ပါ။','F'],
[7,'အသံအနိမ့်အမြင့်နှင့် ဝါကျနိမ့်မြင့်သံများသည် ထိထိရောက်ရောက် စကားပြောဆိုရာတွင် အရေးပါသည်။','T'],
[8,'အသံအနိမ့်အမြင့်နှင့် ဝါကျနိမ့်မြင့်သံများ တိမ်းစောင်းလွဲချော်ခဲ့လျှင် သတ်မှတ်ထားသော အနက်အဓိပ္ပာယ်ကို မရရှိနိုင်ပါ။','T'],
[9,'စကားများ၏ နောက်ကွယ်တွင် မမြင်ရသောအနက်သဘောများ ကိန်းအောင်းလျက် ရှိသည်။','T'],
[10,'မည်သည့်ဘာသာစကားတွင်မဆို အသံအနိမ့်အမြင့်သည် အတိမ်းအစောင်းခံနိုင်သော သဘောတရားတစ်ရပ်ဖြစ်သည်။','F'],

const rngOf = seed => { let a=seed>>>0; return () => { a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; };
const PTYPES = [{id:'tf',name:'မှား / မှန်',hint:'မှန်လျှင် “မှန်”၊ မှားလျှင် “မှား” ကို ရွေးပါ။'},{id:'fill',name:'ကွက်လပ်ဖြည့်',hint:'ကွက်လပ်တွင် ရိုက်ဖြည့်ပါ။'},{id:'mcq',name:'အဖြေမှန်ရွေး',hint:'အဖြေ ၃ ခုအနက် မှန်သည့်တစ်ခုကို ရွေးပါ။'}];
function buildExam(seed){
  const r = rngOf(seed), out = {};
  PTYPES.forEach(T=>{
    const counts=[3,3,3]; counts[r()<0.5?0:2]=4;
    out[T.id] = [];
    LESSONS.forEach((L,li)=>{
      const pool=[]; L.chapters.forEach(c=>c.groups.forEach(g=>(g[T.id]||[]).forEach(q=>pool.push(q))));
      for(let i=pool.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
      pool.slice(0,counts[li]).forEach(q=>out[T.id].push({q,L}));
    });
  });
  return out;
}

  <div class="choices">${q[2].map((o,k)=>`<button class="opt ch3" data-pick="${k}"><i>${K[k]}။</i><span>${esc(o)}</span></button>`).join('')}</div></div></li>`; };

  const setBtns = SETS.map(x=>`<button class="tab settab" role="tab" data-set="${x.id}" aria-selected="${x.id===curSet}"><span>${x.name}</span></button>`).join('');
  if (curSet !== 'old'){
    $app.innerHTML = `
    <section class="hero"><h1><em>${esc(curL.title)}</em></h1></section>
    <div class="tabs sets" role="tablist" aria-label="မေးခွန်းအစုံ">${setBtns}</div>
    <div class="empty"><b>မေးခွန်းသစ်များ မကြာမီ ထည့်ပါမည်။</b>ယခုရှိသော မေးခွန်းများကို “မေးခွန်းဟောင်း” တွင် ကြည့်နိုင်ပါသည်။</div>`;
    return;
  }
  $app.innerHTML = `
    <section class="hero"><h1><em>${esc(curL.title)}</em></h1></section>
    <div class="tabs sets" role="tablist" aria-label="မေးခွန်းအစုံ">${setBtns}</div>
    <div class="chs" role="group" aria-label="အခန်းများ">${chBtns}</div>
    <h2 style="margin-top:16px">အခန်း (${ch.no}) ${esc(ch.title)}</h2>
    <p class="note">မေးခွန်းအောက်ရှိ <span class="chip"><b>၂၄</b>ပြည်တွင်း မေးခွန်း ၂</span> သည် ထိုမေးခွန်း မည်သည့်နှစ်၊ မည်သည့်စာမေးပွဲ၊ မည်သည့်စုံတွင် ပါခဲ့သည်ကို ပြသည်။ နံပါတ်တူ မေးခွန်း ၂ ခု ပါလျှင် စာအုပ်ထဲက ◆ မေးခွန်းဖြစ်သည်။</p>
    <div class="tabbar"><div class="tabs${TT.length>3?' four':''}" role="tablist" aria-label="မေးခွန်းအမျိုးအစား">${tabBtns}</div>${jump}</div>
    ${body}`;
}


/* ===== ဝင်ရောက်ခွင့် (Login) ===== */
function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=[...new TextEncoder().encode(str)], l=b.length*8; b.push(0x80); while(b.length%64!==56) b.push(0);
  for(let i=7;i>=0;i--) b.push(i>3?0:(l>>>(i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const R=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){
    const w=new Array(64); for(let i=0;i<16;i++) w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){ const s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3), s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
    let [a,bb,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){ const S1=R(e,6)^R(e,11)^R(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+w[i])|0, S0=R(a,2)^R(a,13)^R(a,22), mj=(a&bb)^(a&c)^(bb&c), t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=bb; bb=a; a=(t1+t2)|0; }
    H=[(H[0]+a)|0,(H[1]+bb)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
const PW_ADMIN='226f0f8d54ca9d1de5c3d8868186a1d58e0b4bb92b0e5e88637f70eacc342c22', PW_TRIAL='b3cdb70282289144394266d08b08b1cb0083720869e79c3a7ea9af3286a0d143';
const TRIAL_END = new Date(2027,2,20,23,59,59,999).getTime();   // ၂၀-၃-၂၀၂၇ ညသန်းခေါင်အထိ
const pwHash = p => sha256('mck|'+String(p).trim().toUpperCase());
let AUTH = null;
const AK='mck-auth';
function authLoad(){
  try{ const a=JSON.parse(localStorage.getItem(AK)||'null'); if(a&&a.u&&(a.role==='admin'||(a.role==='trial'&&Date.now()<=TRIAL_END))) AUTH=a; else if(a) localStorage.removeItem(AK); }catch(e){}
}
function authSave(){ try{ localStorage.setItem(AK,JSON.stringify(AUTH)); }catch(e){} }
function authClear(){ AUTH=null; try{ localStorage.removeItem(AK); }catch(e){} }
function whoRender(){
  const w=document.getElementById('who'); if(!w) return;
  if(!AUTH){ w.hidden=true; return; }
  w.hidden=false;
  w.innerHTML=`<span><b>${esc(AUTH.u)}</b> · ${AUTH.role==='admin'?'Admin':'စမ်းသုံး ၂၀-၃-၂၀၂၇ အထိ'}</span><button type="button" data-logout>ထွက်မည်</button>`;
}
function viewLogin(msg){
  stopTimer(); AUTH=null; whoRender(); setCrumbs([]);
  $app.innerHTML=`
    <section class="hero"><h1><em>MCK မြန်မာစာ</em></h1><p class="lead">အသုံးပြုရန် အမည်နှင့် စကားဝှက် ထည့်ပါ။</p></section>
    <form class="lg" id="lf" autocomplete="off">
      <label>အမည် (မထည့်လည်း ရသည်)<input id="lu" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label>စကားဝှက် (Password)<input id="lp" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <div class="err" id="lerr" role="alert">${msg?esc(msg):''}</div>
      <button class="btn solid" type="submit" style="min-height:54px;font-size:1.1rem">ဝင်မည်</button>
    </form>`;
}
document.addEventListener('submit', e => {
  if (!e.target || e.target.id!=='lf') return; e.preventDefault();
  const u=document.getElementById('lu').value.trim()||'ဧည့်သည်', p=document.getElementById('lp').value, err=document.getElementById('lerr');
  const h=pwHash(p);
  if (h===PW_ADMIN) AUTH={u,role:'admin'};
  else if (h===PW_TRIAL){ if (Date.now()>TRIAL_END){ err.textContent='ဤစကားဝှက်၏ စမ်းသုံးခွင့် ၂၀-၃-၂၀၂၇ တွင် ကုန်ဆုံးပါပြီ။'; return; } AUTH={u,role:'trial'}; }
  else { err.textContent='စကားဝှက် မှားနေပါသည်။'; return; }
  authSave(); whoRender(); show(location.hash.slice(1));
});
authLoad();
/* ===== လမ်းကြောင်း ===== */
function show(h){
  stopTimer();
  if (AUTH && AUTH.role==='trial' && Date.now()>TRIAL_END){ authClear(); return viewLogin('စမ်းသုံးခွင့် ကုန်ဆုံးပါပြီ (၂၀-၃-၂၀၂၇)။'); }
  if (!AUTH) return viewLogin();
  whoRender();
  const [g, l, c, t] = (h||'').split('-');
  if (g !== 'g12') return viewHome();
  if (l==='practice') return viewPractice(c);
  const LL = LESSONS.find(x=>x.id===l);
  if (!LL) return viewGrade();
  curL = LL;
  curTab = (['tf','fill','mcq'].includes(t) || (t==='kh' && curL.hasKh)) ? t : (curTab==='kh' && !curL.hasKh ? 'tf' : curTab);
  const ci = Math.min(Math.max((parseInt(c,10)||1)-1,0), curL.chapters.length-1);
  viewLesson(ci);
}
function navigate(h){ try{ location.hash = h; }catch(e){} show(h); window.scrollTo(0,0); }
const curChapter = () => { const p=(location.hash.slice(1)||'').split('-'); return Math.min(Math.max((parseInt(p[2],10)||1),1),3); };

/* ===== အဖြေ ပြ/ဖျောက် ===== */
const norm = x => x.replace(/\s+/g,'');
function setRevealed(q,on){
  q.classList.toggle('revealed',on);
  const inp=q.querySelector('input.blank');
  if (inp){
    inp.classList.remove('ok','bad');
    if (on && inp.value.trim()){
      let acc=[]; try{ acc=JSON.parse(q.dataset.ans); }catch(e){}
      inp.classList.add(acc.some(a=>norm(a)===norm(inp.value)) ? 'ok' : 'bad');
    }
  }
  q.querySelector('.ans').hidden = !on;
  q.querySelector('[data-rv]').textContent = on ? 'အဖြေဖျောက်မည်' : 'အဖြေကြည့်မည်';
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-set],[data-tab],[data-rv],[data-pick],[data-all],[data-reset],[data-jump],[data-newexam],[data-clear],[data-dur],[data-start],[data-end],[data-logout]');
  if (!t) return;
  if (t.hasAttribute('data-logout')){ authClear(); viewLogin(); return; }
  if (t.hasAttribute('data-dur')){ PX.mins=+t.getAttribute('data-dur'); t.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b===t)); return; }
  if (t.hasAttribute('data-start')){ PX.ex=buildExam(PX.seed); PX.ended=false; PX.endAt=Date.now()+PX.mins*60000; renderExam(); window.scrollTo(0,0); return; }
  if (t.hasAttribute('data-end')){
    if (t.dataset.sure){ endExam(); return; }
    t.dataset.sure='1'; t.textContent='သေချာပါသလား? ထပ်နှိပ်ပါ';
    setTimeout(()=>{ if(t.isConnected&&!PX.ended){ delete t.dataset.sure; t.textContent='ပြီးပါပြီ'; } },4000); return; }
  if (t.hasAttribute('data-newexam')){ navigate('g12-practice-'+(1000+Math.floor(Math.random()*9000))); return; }
  if (t.hasAttribute('data-clear')){ $app.querySelectorAll('.q .opt').forEach(o=>o.classList.remove('picked')); $app.querySelectorAll('input.blank').forEach(i=>i.value=''); return; }
  if (t.hasAttribute('data-nav')){ e.preventDefault(); navigate(t.getAttribute('data-nav')); return; }
  if (t.hasAttribute('data-jump')){
    const g=document.getElementById('grp-'+t.getAttribute('data-jump')); if(!g) return;
    const bar=$app.querySelector('.tabbar'), off=(bar?bar.offsetHeight:0)+8;
    window.scrollTo({top:g.getBoundingClientRect().top+window.scrollY-off,behavior:'smooth'});
    g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash');
    t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t)); return;
  }
  if (t.hasAttribute('data-set')){ curSet = t.getAttribute('data-set'); show(location.hash.slice(1)); return; }
  if (t.hasAttribute('data-tab')){
    curTab = t.getAttribute('data-tab');
    const h = 'g12-'+curL.id+'-'+curChapter()+'-'+curTab;
    try{ history.replaceState(null,'','#'+h); }catch(er){}
    show(h); return;
  }
  if (t.hasAttribute('data-rv')){ const q=t.closest('.q'); setRevealed(q,!q.classList.contains('revealed')); return; }
  if (t.hasAttribute('data-pick')){
    const q=t.closest('.q'); if (q.classList.contains('revealed')) return;
    q.querySelectorAll('.opt').forEach(o=>o.classList.toggle('picked',o===t)); return;
  }
  if (t.hasAttribute('data-all')){
    const qs=[...$app.querySelectorAll('.q')], anyHidden=qs.some(q=>!q.classList.contains('revealed'));
    qs.forEach(q=>setRevealed(q,anyHidden));
    t.textContent = anyHidden ? 'အဖြေအားလုံး ဖျောက်မည်' : 'အဖြေအားလုံး ကြည့်မည်'; return;
  }
  if (t.hasAttribute('data-reset')){
    $app.querySelectorAll('.q').forEach(q=>{ setRevealed(q,false); q.querySelectorAll('.opt').forEach(o=>o.classList.remove('picked')); const i=q.querySelector('input.blank'); if(i) i.value=''; });
    const all=$app.querySelector('[data-all]'); if (all) all.textContent='အဖြေအားလုံး ကြည့်မည်';
  }
});
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));

(function(){
  const box=document.createElement('div'); box.className='scrollnav';
  box.innerHTML='<button type="button" id="goTop" aria-label="အပေါ်ဆုံးသို့"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/><path d="M5 20h14"/></svg></button><button type="button" id="goBot" aria-label="အောက်ဆုံးသို့"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/><path d="M5 4h14"/></svg></button>';
  document.body.appendChild(box);
  const go=top=>{ try{ const y=top?0:Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);
      window.scrollTo(0,y); document.documentElement.scrollTop=y; document.body.scrollTop=y; }catch(er){} };
  box.addEventListener('click',e=>{ e.stopPropagation(); const b=e.target.closest('button'); if(b) go(b.id==='goTop'); });
})();
